services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintech-jenkins
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Linux server: allow Jenkins to run docker builds on the host
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:

