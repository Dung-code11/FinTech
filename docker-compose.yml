services:
  db:
    image: mysql:8.4.9
    container_name: fintech-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fintech}
      MYSQL_USER: ${MYSQL_USER:-fintech}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fintech_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - fintech_mysql_data:/var/lib/mysql
      - ./Dump20260521.sql:/docker-entrypoint-initdb.d/01-Dump20260521.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: fintech-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SQL_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-fintech}
      SQL_USERNAME: ${MYSQL_USER:-fintech}
      SQL_PASSWORD: ${MYSQL_PASSWORD:-fintech_password}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-change-me-change-me-change-me}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_API_URL: /api
    container_name: fintech-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"

volumes:
  fintech_mysql_data:
